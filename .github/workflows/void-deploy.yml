name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec void prepare
      - run: vp check
      - run: vp test run
      - run: vp build
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Override this when deploying through a different Cloudflare account.
          CLOUDFLARE_WORKERS_SUBDOMAIN:
            ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'jtclarkjr' }}
          # Required only when Cloudflare Access protects Worker readiness.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: vp run deploy
